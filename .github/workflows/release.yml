name: Build & Release Kylo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS build ────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mac
        run: npm run build && npx electron-builder --mac --publish never

      - name: Show electron-builder output (debug)
        run: find . -not -path '*/node_modules/*' -not -path '*/.git/*' \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) | sort

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  # ── Windows build ──────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build && npx electron-builder --win --publish never

      - name: Show electron-builder output (debug)
        shell: pwsh
        run: Get-ChildItem -Recurse -Exclude node_modules,.git | Where-Object { $_.Extension -in '.exe','.msi','.blockmap' } | Select-Object FullName

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.blockmap
            dist/*.exe
            dist/*.msi
            dist/*.blockmap
          if-no-files-found: error

  # ── Publish ────────────────────────────────────────────────────────────
  publish:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-build
          path: dist

      - name: List dist (debug)
        run: find dist -type f | sort

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kylo ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}